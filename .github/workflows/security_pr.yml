name: Security Checks for Pull Requests
on:
  pull_request: null

permissions:
  contents: read

jobs:
  dependency-review:
    permissions:
        contents: read
        pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@v5.0.0
        with:
          comment-summary-in-pr: on-failure

  gosec_scan:
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run Gosec Security Scanner on root directory
        uses: securego/gosec@v2.30.0
        with:
          # We need to temporarily exclude this as gosec doesn't
          # support using module files from subdirectories.
          args: -exclude-dir=k8s -exclude=G117 ./...
